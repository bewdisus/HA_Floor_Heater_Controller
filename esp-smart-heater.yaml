# Board: Wemos D1 Mini (ESP8266) (Wemos)
# Definition: definitions/boards/d1_mini/manifest.yaml

esphome:
  name: esp-smart-heater
  friendly_name: ESP Smart Heater
  on_boot:
    then:
      - lambda: |-
          id(boot_ms) = millis();
          id(ctrl_state) = 0;
          id(ctrl_state_text) = "INIT";
          id(last_reason) = "Boot";
          id(overheat_latched) = false;
          id(boot_evaluated) = false;
          id(sensor_fault_active) = false;
          id(recovery_start_ms) = 0;

esp8266:
  board: d1_mini
  # Без этого флага preference-значения (режим, уставки) хранятся в RTC-памяти
  # и теряются при снятии питания. Нужен для ТЗ §9 и приёмочного п.12.
  restore_from_flash: true

logger:
  level: INFO

api:
  encryption:
    key: "R0jbpGPAJtGqk7d14NiJzb36UqA7BVkPaWRt77VWNSk="
  # Не перезагружать контроллер, если HA недоступен дольше 15 минут (ТЗ §13).
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # При потере Wi-Fi контроллер продолжает автономную работу и не перезагружается.
  reboot_timeout: 0s
  ap:
    ssid: ESP Smart Heate Fallback Hotspot
    password: "QWkEh0RiTSbV"

captive_portal:

globals:
  - id: boot_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: last_measurement_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: ctrl_state
    type: int
    restore_value: false
    initial_value: '0'
  - id: ctrl_state_text
    type: std::string
    restore_value: false
    initial_value: '"INIT"'
  - id: last_reason
    type: std::string
    restore_value: false
    initial_value: '"Boot"'
  - id: overheat_latched
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: boot_evaluated
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: sensor_fault_active
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: recovery_start_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: published_state
    type: std::string
    restore_value: false
    initial_value: '""'
  - id: published_reason
    type: std::string
    restore_value: false
    initial_value: '""'
  # Состояние публикации бинарных датчиков: 2 — ещё не публиковалось.
  - id: published_fault
    type: int
    restore_value: false
    initial_value: '2'
  - id: published_overheat
    type: int
    restore_value: false
    initial_value: '2'
  - id: published_pump
    type: int
    restore_value: false
    initial_value: '2'

sensor:
  - platform: adc
    name: NTC Voltage
    id: sensor_adc_1
    pin: GPIO17
    update_interval: 5s
    accuracy_decimals: 3
    state_class: measurement
    filters:
      - multiply: 3.11
    samples: 10
  - platform: resistance
    name: NTC Resistance
    id: sensor_resistance_1
    state_class: measurement
    configuration: DOWNSTREAM
    resistor: 47kΩ
    sensor: sensor_adc_1
  - platform: ntc
    id: sensor_ntc_1
    name: Floor Temperature
    device_class: temperature
    state_class: measurement
    sensor: sensor_resistance_1
    calibration:
      b_constant: 3930
      reference_temperature: 25°C
      reference_resistance: 9.5kOhm
    on_value:
      - lambda: |-
          id(last_measurement_ms) = millis();

  # Расчётные пороги гистерезиса: нужны на графиках этапа 3 и при настройке
  # адаптивной компенсации на этапе 4. На управление не влияют.
  - platform: template
    name: Lower Threshold
    id: lower_threshold
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    update_interval: 5s
    lambda: |-
      float t = id(target_floor_temperature).state;
      float h = id(heating_hysteresis).state;
      if (std::isnan(t) || std::isnan(h)) return NAN;
      return t - h / 2.0f;
  - platform: template
    name: Upper Threshold
    id: upper_threshold
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    update_interval: 5s
    lambda: |-
      float t = id(target_floor_temperature).state;
      float h = id(heating_hysteresis).state;
      if (std::isnan(t) || std::isnan(h)) return NAN;
      return t + h / 2.0f;

  # Служебная диагностика для сбора данных: перезагрузки и качество связи.
  - platform: uptime
    name: Uptime
    id: uptime_sensor
    entity_category: diagnostic
    update_interval: 60s
  - platform: wifi_signal
    name: Wi-Fi Signal
    id: wifi_signal_db
    entity_category: diagnostic
    update_interval: 60s

switch:
  - platform: gpio
    name: Pump relay
    id: switch_gpio_1
    internal: true
    pin:
      number: GPIO14
      mode:
        output: true
      inverted: true
    restore_mode: ALWAYS_OFF

select:
  - platform: template
    name: Heating Mode
    id: heating_mode
    optimistic: true
    restore_value: true
    initial_option: "Auto"
    options:
      - "Auto"
      - "Manual ON"
      - "Off"

number:
  - platform: template
    name: Target Floor Temperature
    id: target_floor_temperature
    optimistic: true
    min_value: 15.0
    max_value: 40.0
    step: 0.5
    initial_value: 25.0
    restore_value: true
    unit_of_measurement: "°C"
    mode: box
  - platform: template
    name: Heating Hysteresis
    id: heating_hysteresis
    optimistic: true
    min_value: 0.2
    max_value: 5.0
    step: 0.1
    initial_value: 1.0
    restore_value: true
    unit_of_measurement: "°C"
    mode: box
  - platform: template
    name: Overheat ON Temperature
    id: overheat_on_temperature
    optimistic: true
    min_value: 45.0
    max_value: 50.0
    step: 0.5
    initial_value: 45.0
    restore_value: true
    unit_of_measurement: "°C"
    mode: box
  - platform: template
    name: Overheat OFF Temperature
    id: overheat_off_temperature
    optimistic: true
    min_value: 43.0
    max_value: 44.5
    step: 0.5
    initial_value: 43.0
    restore_value: true
    unit_of_measurement: "°C"
    mode: box
  - platform: template
    name: Sensor Valid Min
    id: sensor_valid_min
    optimistic: true
    min_value: -30.0
    max_value: 20.0
    step: 1.0
    initial_value: -20.0
    restore_value: true
    unit_of_measurement: "°C"
    mode: box
  - platform: template
    name: Sensor Valid Max
    id: sensor_valid_max
    optimistic: true
    min_value: 60.0
    max_value: 100.0
    step: 1.0
    initial_value: 90.0
    restore_value: true
    unit_of_measurement: "°C"
    mode: box

button:
  - platform: template
    name: Reset Overheat Alarm
    id: reset_overheat_alarm
    on_press:
      - lambda: |-
          if (!id(overheat_latched)) {
            ESP_LOGI("control", "Overheat reset ignored: no active alarm");
            return;
          }
          if (id(sensor_fault_active)) {
            ESP_LOGW("control", "Overheat reset rejected: sensor fault active");
            return;
          }
          if (!id(sensor_ntc_1).has_state() ||
              std::isnan(id(sensor_ntc_1).state) ||
              millis() - id(last_measurement_ms) > 30000) {
            ESP_LOGW("control", "Overheat reset rejected: sensor reading missing or stale");
            return;
          }
          float t = id(sensor_ntc_1).state;
          float v = id(sensor_adc_1).state;
          float r = id(sensor_resistance_1).state;
          float vmin = id(sensor_valid_min).state;
          float vmax = id(sensor_valid_max).state;
          float oh_off = id(overheat_off_temperature).state;
          if (std::isnan(v) || std::isnan(r) ||
              std::isnan(vmin) || std::isnan(vmax) || std::isnan(oh_off) ||
              v < 0.03f || v > 2.8f ||
              r < 500.0f || r > 300000.0f ||
              t < vmin || t > vmax) {
            ESP_LOGW("control", "Overheat reset rejected: sensor reading invalid");
            return;
          }
          if (t > oh_off) {
            ESP_LOGW("control", "Overheat reset rejected: %.1f C above %.1f C", t, oh_off);
            return;
          }
          id(overheat_latched) = false;
          id(last_reason) = "Overheat reset by user";
          ESP_LOGI("control", "Overheat alarm reset at %.1f C", t);

binary_sensor:
  - platform: template
    name: Sensor Fault
    id: sensor_fault
    device_class: problem
  - platform: template
    name: Overheat Alarm
    id: overheat_alarm
    device_class: problem
  - platform: template
    name: Pump Running
    id: pump_running
    device_class: running

text_sensor:
  - platform: template
    name: Controller State
    id: controller_state
  - platform: template
    name: Last Reason
    id: last_reason_sensor

interval:
  - interval: 1s
    then:
      - lambda: |-
          const int ST_INIT = 0;
          const int ST_IDLE = 1;
          const int ST_HEATING = 2;
          const int ST_MANUAL_ON = 3;
          const int ST_OFF = 4;
          const int ST_SENSOR_ERROR = 5;
          const int ST_OVERHEAT = 6;

          auto set_state = [&](int new_state, const char *name, const char *reason) {
            if (id(ctrl_state) != new_state) {
              id(ctrl_state) = new_state;
              id(ctrl_state_text) = name;
              id(last_reason) = reason;
              ESP_LOGI("control", "State -> %s (%s)", name, reason);
            } else if (id(last_reason) != reason) {
              id(last_reason) = reason;
            }
          };

          auto set_relay = [&](bool on) {
            if (on) {
              if (!id(switch_gpio_1).state) {
                id(switch_gpio_1).turn_on();
              }
            } else {
              if (id(switch_gpio_1).state) {
                id(switch_gpio_1).turn_off();
              }
            }
          };

          uint32_t now = millis();

          float target = id(target_floor_temperature).state;
          float hyst = id(heating_hysteresis).state;
          float oh_on = id(overheat_on_temperature).state;
          float oh_off = id(overheat_off_temperature).state;
          float vmin = id(sensor_valid_min).state;
          float vmax = id(sensor_valid_max).state;
          if (std::isnan(target) || std::isnan(hyst) ||
              std::isnan(oh_on) || std::isnan(oh_off) ||
              std::isnan(vmin) || std::isnan(vmax)) {
            set_relay(false);
            set_state(ST_INIT, "INIT", "Settings not ready");
            return;
          }

          bool has_state = id(sensor_ntc_1).has_state();
          bool fresh = has_state && (now - id(last_measurement_ms) <= 30000);

          float t = NAN;
          float v = NAN;
          float r = NAN;
          bool sensor_ok = false;

          if (has_state) {
            t = id(sensor_ntc_1).state;
            v = id(sensor_adc_1).state;
            r = id(sensor_resistance_1).state;
            sensor_ok = fresh
              && !std::isnan(t) && !std::isnan(v) && !std::isnan(r)
              && v >= 0.03f && v <= 2.8f
              && r >= 500.0f && r <= 300000.0f
              && t >= vmin && t <= vmax;
          }

          if (!has_state) {
            set_relay(false);
            if (now - id(boot_ms) <= 15000) {
              set_state(ST_INIT, "INIT", "Waiting for NTC");
            } else {
              id(sensor_fault_active) = true;
              id(recovery_start_ms) = 0;
              set_state(ST_SENSOR_ERROR, "SENSOR_ERROR", "NTC not available");
            }
            return;
          }

          if (!sensor_ok) {
            id(sensor_fault_active) = true;
            id(recovery_start_ms) = 0;
            set_relay(false);
            set_state(ST_SENSOR_ERROR, "SENSOR_ERROR", "NTC reading invalid");
            return;
          }

          // Latch overheat immediately, even while the sensor is recovering.
          if (t >= oh_on) {
            if (!id(overheat_latched)) {
              ESP_LOGW("control", "Overheat detected: %.1f C >= %.1f C", t, oh_on);
            }
            id(overheat_latched) = true;
          }

          // Require 15 s of continuous valid readings before leaving SENSOR_ERROR.
          if (id(sensor_fault_active)) {
            if (id(recovery_start_ms) == 0) {
              id(recovery_start_ms) = now;
            }
            if (now - id(recovery_start_ms) < 15000) {
              set_relay(false);
              set_state(ST_SENSOR_ERROR, "SENSOR_ERROR", "Recovering");
              return;
            }
            id(sensor_fault_active) = false;
            ESP_LOGI("control", "NTC readings recovered");
          }

          if (!id(boot_evaluated)) {
            id(boot_evaluated) = true;
            if (t >= oh_on || t > oh_off) {
              id(overheat_latched) = true;
              ESP_LOGW("control", "Overheat latched at boot: %.1f C (OFF threshold %.1f C)",
                       t, oh_off);
            } else {
              ESP_LOGI("control", "Boot temperature check passed: %.1f C", t);
            }
          }

          if (id(overheat_latched)) {
            set_relay(false);
            set_state(ST_OVERHEAT, "OVERHEAT", "Overheat latched");
            return;
          }

          std::string mode = id(heating_mode).current_option();
          if (mode != "Auto" && mode != "Manual ON" && mode != "Off") {
            set_relay(false);
            set_state(ST_INIT, "INIT", "Mode not ready");
            return;
          }
          if (mode == "Off") {
            set_relay(false);
            set_state(ST_OFF, "OFF", "Mode Off");
            return;
          }
          if (mode == "Manual ON") {
            set_relay(true);
            set_state(ST_MANUAL_ON, "MANUAL_ON", "Manual ON");
            return;
          }

          float t_on = target - hyst / 2.0f;
          float t_off = target + hyst / 2.0f;

          if (t <= t_on) {
            set_relay(true);
            set_state(ST_HEATING, "HEATING", "Below lower threshold");
          } else if (t >= t_off) {
            set_relay(false);
            set_state(ST_IDLE, "IDLE", "Above upper threshold");
          } else if (id(ctrl_state) == ST_HEATING) {
            set_relay(true);
            set_state(ST_HEATING, "HEATING", "Within hysteresis band");
          } else {
            set_relay(false);
            set_state(ST_IDLE, "IDLE", "Within hysteresis band");
          }
  - interval: 1s
    then:
      - lambda: |-
          // Бинарные датчики публикуем только при изменении значения.
          // published_* == 2 означает "ещё ни разу не публиковали".
          int fault = (id(ctrl_state_text) == "SENSOR_ERROR") ? 1 : 0;
          if (fault != id(published_fault)) {
            id(published_fault) = fault;
            id(sensor_fault).publish_state(fault == 1);
          }
          int overheat = id(overheat_latched) ? 1 : 0;
          if (overheat != id(published_overheat)) {
            id(published_overheat) = overheat;
            id(overheat_alarm).publish_state(overheat == 1);
          }
          int pump = id(switch_gpio_1).state ? 1 : 0;
          if (pump != id(published_pump)) {
            id(published_pump) = pump;
            id(pump_running).publish_state(pump == 1);
          }
          if (id(published_state) != id(ctrl_state_text)) {
            id(published_state) = id(ctrl_state_text);
            id(controller_state).publish_state(id(published_state));
          }
          if (id(published_reason) != id(last_reason)) {
            id(published_reason) = id(last_reason);
            id(last_reason_sensor).publish_state(id(published_reason));
          }